# ==============================================================================
# nginx.conf — NGINX S3 gateway main configuration
#
# Extends the upstream nginx-s3-gateway image with:
#   - JSON access log format for CloudWatch metric extraction
#   - worker_processes auto (the upstream sets 1; we scale to the Fargate vCPU)
#
# The upstream image loads ngx_http_js_module and ngx_http_xslt_filter_module
# (both present in the base image).  All other configuration — SigV4 signing,
# credential management, S3 proxy routing, directory indexing, error handling,
# and caching — is provided by the upstream templates.
#
# Reference: VISION.md §2.4, §8.6; upstream nginx-s3-gateway (F5, Apache 2.0)
# ==============================================================================

user  nginx;
worker_processes  auto;

# NJS module used for implementing S3 authentication
load_module modules/ngx_http_js_module.so;
load_module modules/ngx_http_xslt_filter_module.so;

# Preserve S3 environment variables for worker threads
env AWS_ACCESS_KEY_ID;
env AWS_SECRET_ACCESS_KEY;
env AWS_SESSION_TOKEN;
env S3_BUCKET_NAME;
env S3_SERVER;
env S3_SERVER_PORT;
env S3_SERVER_PROTO;
env S3_REGION;
env AWS_SIGS_VERSION;
env DEBUG;
env S3_STYLE;
env S3_SERVICE;
env ALLOW_DIRECTORY_LIST;
env PROVIDE_INDEX_PAGE;
env APPEND_SLASH_FOR_POSSIBLE_DIRECTORY;
env DIRECTORY_LISTING_PATH_PREFIX;
env PROXY_CACHE_MAX_SIZE;
env PROXY_CACHE_INACTIVE;
env PROXY_CACHE_SLICE_SIZE;
env PROXY_CACHE_VALID_OK;
env PROXY_CACHE_SLICE_SIZE;
env PROXY_CACHE_VALID_NOTFOUND;
env PROXY_CACHE_VALID_FORBIDDEN;
env HEADER_PREFIXES_TO_STRIP;
env FOUR_O_FOUR_ON_EMPTY_BUCKET;
env STRIP_LEADING_DIRECTORY_PATH;
env PREFIX_LEADING_DIRECTORY_PATH;
# nginx strips inherited env vars unless listed: host-resolver.js reads these,
# and upstream awscredentials.js needs the ECS task-role credentials URI.
env AWS_REGION;
env AWS_CONTAINER_CREDENTIALS_RELATIVE_URI;
env SITE_METADATA_TABLE_NAME;
env RESOLVE_CACHE_TTL_SECONDS;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # Shared-dictionary zone for host-to-prefix resolution cache.
    #
    # Stores resolved hostname -> S3 prefix mappings (positive and negative
    # entries).  timeout=5s keeps entries for 5 seconds before eviction;
    # actual entry lifetime is governed by the njs module via explicit
    # expiry timestamps.  4 MiB accommodates ~16,000 entries.
    #
    # Reference: docs/design-gateway-host-to-prefix-resolution.md §5
    # ---------------------------------------------------------------------------
    js_shared_dict_zone zone=resolve_cache:4m timeout=5s evict type=string;

    # Combined access log format (human-readable) — kept for local debugging.
    # Prefer the JSON format below for production observability.
    # ---------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_host" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    # ---------------------------------------------------------------------------
    # JSON access log format — structured logs for CloudWatch metric extraction.
    #
    # Escape=json ensures special characters in variable values are properly
    # escaped.  Used as the default access_log format for production.
    #
    # Fields:
    #   timestamp           — ISO 8601 request time
    #   remote_addr         — client IP
    #   method              — HTTP method
    #   uri                 — request URI
    #   status              — HTTP status code
    #   body_bytes_sent     — response body size (bytes)
    #   request_time        — total request processing time (seconds, float)
    #   upstream_response_time — upstream (S3) response time (seconds)
    #   host                — Host header (used for site routing)
    #   user_agent          — client User-Agent
    # ---------------------------------------------------------------------------
    log_format json escape=json
      '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$http_host",'
        '"user_agent":"$http_user_agent"'
      '}';

    access_log  /dev/stdout  json;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
